name: Windows

on:
  pull_request:
    paths:
      - "NectoWindows/**"
      # Compiled into the client with include_str!.
      - "WebPackages/Bridge/theme.css"
      - ".github/workflows/windows.yml"
  push:
    paths:
      - "NectoWindows/**"
      - "WebPackages/Bridge/theme.css"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Build & Tests
    if: github.server_url == 'https://github.com'
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: NectoWindows/src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Show Rust version
        run: cargo --version
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked -- -D warnings
      - name: Build installers
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v7
        with:
          name: necto-windows
          path: |
            NectoWindows/src-tauri/target/release/bundle/nsis/*.exe
            NectoWindows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
